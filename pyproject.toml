[project]
name = "memoir"
version = "0.0.1"
description = "Mines git history to find who most likely holds the mental model of a file."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "fastmcp",
]

[project.scripts]
memoir = "memoir.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
